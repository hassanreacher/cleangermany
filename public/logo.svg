<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-label="Glanzgeschwister – Präzise. Sicher. Zuverlässig.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&amp;display=swap');
    .w { font-family: 'Poppins', 'Montserrat', Arial, sans-serif; font-size: 78px; letter-spacing: -0.5px; }
    .light { font-weight: 300; fill: #35a9cc; }
    .bold { font-weight: 700; fill: #1d4fb3; }
